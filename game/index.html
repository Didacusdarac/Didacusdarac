<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dona Manía</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one full-screen canvas. The world is drawn into a tiny low-res buffer and scaled up
   with nearest-neighbour for a pixel-art look; text is drawn crisp on top. Single committed look. */
:root{
  --bg:#5fae3e; --ink:#2a1a26; --cream:#fff6e6; --pink:#ff4f8f; --mint:#2fbf8f; --gold:#ffc83d;
  --font-pixel:"Pixelify Sans",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-pixel);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;image-rendering:pixelated}
</style>
<canvas id="c" tabindex="0" aria-label="Dona Manía: arrastra para mover al cocinero, lleva donas, café y pizza al mostrador y cobra"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const lo=document.createElement('canvas'),q=lo.getContext('2d');
const FONT='"Pixelify Sans",ui-monospace,monospace';
try{document.fonts&&document.fonts.load('700 16px "Pixelify Sans"');}catch(e){}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=720,FLOOR_H=815,WORLD_TOP=-90,WORLD_BOT=1160,P=3; // P = world units per art pixel
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

/* ---------- state & save ---------- */
const SAVE='dona-mania-v1';
const fresh=()=>({money:0,earned:0,cap:0,spd:0,oven:0,price:0,coffee:0,pizza:0,dm:0,hup:0,hire:0,bar:0,wash:0,prestige:0,mute:0,tut:0,first:0,spec:'',paid:{}});
let st=fresh();
try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&typeof s==='object')st=Object.assign(fresh(),s);if(!st.paid||typeof st.paid!=='object')st.paid={};}catch(e){}
if(st.h1||st.h2){st.hire=Math.max(st.hire,(st.h1?1:0)+(st.h2?1:0));}
delete st.h1;delete st.h2;delete st.paid.h1;delete st.paid.h2;
const LIM={cap:8,spd:5,oven:6,price:5,coffee:2,pizza:2,dm:2,hup:5,hire:4,bar:1,wash:3,prestige:9999};
for(const k in LIM){const v=Math.floor(Number(st[k]));st[k]=isFinite(v)&&v>0?Math.min(v,LIM[k]):0;}
for(const k of['money','earned','pile','first']){const v=Number(st[k]);st[k]=isFinite(v)&&v>0?Math.min(v,1e15):0;}
if(!['bak','caf','piz'].includes(st.spec))st.spec='';
st.tut=Math.min(2,Math.max(0,Math.floor(Number(st.tut))||0));st.mute=st.mute?1:0;
{const pd={};for(const k in st.paid){const v=Number(st.paid[k]);if(isFinite(v)&&v>0&&k in LIM)pd[k]=v;}st.paid=pd;}
function save(){st.pile=cash.pile;if(!title)st.ts=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(st));}catch(e){}}

const DONUT=0,COFFEE=1,PIZZA=2;
const BASE_PRICE=[5,9,15],MAKE_T=[1,1.25,1.6],STACK_H=[3,6,3];
const capacity=()=>6+2*st.cap;
const speed=()=>205+26*st.spd;
const ovenInterval=()=>1.0*Math.pow(0.8,st.oven);
const mult=()=>(1+0.5*st.price)*(1+st.prestige);
const SPECS=[{id:'bak',name:'Panadería',desc:'Donas x2 · 1 máquina extra gratis',t:DONUT},
 {id:'caf',name:'Cafetería',desc:'Café x2 · cafetera gratis',t:COFFEE},
 {id:'piz',name:'Pizzería',desc:'Pizza x1.6 · pizzería gratis',t:PIZZA}];
const specOf=()=>SPECS.find(x=>x.id===st.spec)||null;
const specMul=t=>{const sp=specOf();return sp&&sp.t===t?(t===PIZZA?1.6:2):1;};
const priceOf=t=>BASE_PRICE[t]*mult()*specMul(t);
const HUD_TOP=104,TIP_T=5,COUNTER_MAX=24,trayMax=()=>8+2*st.oven,HIRE_MAX=4;

const PADS=[
 {id:'cap',x:260,y:310,name:'Bandeja',sub:'+2 de carga',base:30,g:1.85,max:8},
 {id:'oven',x:390,y:310,name:'Horno',sub:'más rápido',base:40,g:2,max:6},
 {id:'price',x:520,y:310,name:'Receta',sub:'+50% precio',base:120,g:2,max:5},
 {id:'spd',x:260,y:450,name:'Patines',sub:'velocidad',base:50,g:2,max:5},
 {id:'hire',x:390,y:450,name:'Empleado',sub:'+1 ayudante',base:350,g:2.3,max:HIRE_MAX},
 {id:'hup',x:520,y:450,name:'Entrenar',sub:'ayudantes',base:300,g:2,max:5,req:()=>st.hire>=1},
 {id:'dm',get x(){return 225+135*st.dm;},y:150,name:'Máquina',sub:'+1 de donas',base:200,g:4,max:2},
 {id:'coffee',get x(){return 495+135*st.coffee;},y:150,name:'Cafetera',sub:'+1 de café',base:150,g:6,max:2},
 {id:'pizza',x:70,get y(){return 330+170*st.pizza;},name:'Pizzería',sub:'+1 de pizza',base:900,g:3,max:2,req:()=>st.coffee>=1},
 {id:'bar',x:640,y:590,name:'Barra',sub:'comer aquí',base:1500,g:1,max:1,req:()=>st.coffee>=1&&st.hire>=1},
 {id:'wash',x:540,y:590,name:'Lavaplatos',sub:'+2 platos, más rápido',base:400,g:2,max:3,req:()=>st.bar>=1},
 {id:'branch',x:390,y:590,name:'Sucursal',sub:'ganancia +100%',base:6000,g:1.8,max:1e9,req:()=>st.coffee>=1&&st.pizza>=1&&st.hire>=2},
];
const lvlOf=p=>p.id==='branch'?st.prestige:st[p.id];
const COST_PER_BRANCH=2;
const costOf=p=>Math.max(5,Math.round(p.base*Math.pow(p.g,lvlOf(p))*Math.pow(COST_PER_BRANCH,st.prestige)/5)*5);
const padOn=p=>lvlOf(p)<p.max&&(!p.req||p.req());

/* ---------- world objects ---------- */
const machines=[
 {t:DONUT,x:90,y:130,stock:2,timer:0,on:()=>true},
 {t:DONUT,x:225,y:130,stock:0,timer:0,on:()=>st.dm>=1},
 {t:DONUT,x:360,y:130,stock:0,timer:0,on:()=>st.dm>=2},
 {t:COFFEE,x:495,y:130,stock:0,timer:0,on:()=>st.coffee>=1},
 {t:COFFEE,x:630,y:130,stock:0,timer:0,on:()=>st.coffee>=2},
 {t:PIZZA,x:70,y:330,stock:0,timer:0,on:()=>st.pizza>=1},
 {t:PIZZA,x:70,y:500,stock:0,timer:0,on:()=>st.pizza>=2},
];
const pickupOf=m=>m.t===PIZZA?{x:m.x+96,y:m.y+8}:{x:m.x,y:m.y+88};
const trayOf=m=>m.t===PIZZA?{x:m.x+66,y:m.y+6}:{x:m.x,y:m.y+40};
const counter={stock:[0,0,0],x:[220,360,500],y:838};
const cash={x:652,y:735,pile:0};cash.pile=Math.max(0,st.pile||0);
const SLOTS=[170,290,410,530].map(x=>({x,y:918,c:null}));
/* eating bar: 3 stools, a shared pool of plates, a dishwasher. Dirty plates are never saved. */
const SEATS=[320,400,480].map(y=>({x:640,y,c:null,dirty:false}));
const EAT_T=6,DINER_MUL=1.8,WASHER={x:640,y:600};
const platesTotal=()=>4+2*st.wash,washTime=()=>5-0.7*st.wash;
const plates={clean:4+2*st.wash},washer={queue:0,cur:0,t:0};
let barHintDone=false;
function resetBar(){for(const x of SEATS){x.c=null;x.dirty=false;}plates.clean=platesTotal();washer.queue=washer.cur=0;washer.t=0;player.plates=0;}
const player={x:300,y:600,vx:0,vy:0,face:1,walk:0,moving:false,carry:[],lean:0,takeT:0,dropT:0,cashT:0,padT:0,plates:0};
let helpers=[],customers=[],fly=[],floats=[],confetti=[];
const rush={next:rand(70,100),left:0};
let offline=null;const spec={open:false};
let menu=null;const hold={on:false,id:null,t:0};const HOLD_T=1.2;
let title=!/[?&]menu=0\b/.test(location.search); // main menu; ?menu=0 skips it (tests)
let spawnT=0.5,time=0,saveT=0,banner=null,shownMoney=st.money;
const THEMES=[['#f0cf96','#e6bf80'],['#c7ddf2','#b3cdea'],['#f2c6da','#e8b2ca'],['#d2ecbf','#bddfa6']];
const HELPER_COLS=['#4f9dff','#2fbf8f','#a86ff2','#ff8a3d'];
const products=()=>{const a=[DONUT];if(st.coffee)a.push(COFFEE);if(st.pizza)a.push(PIZZA);return a;};

function syncHelpers(){
  while(helpers.length<st.hire){const i=helpers.length;
    helpers.push({i,col:HELPER_COLS[i],t:DONUT,m:null,x:390+(i%2?40:-40),y:530,carry:[],state:'toMachine',wait:0,actT:0,walk:0,face:-1,moving:false});}
  helpers.length=Math.min(helpers.length,st.hire);
}
syncHelpers();

/* ---------- offline earnings: helpers keep the shop running while you are away ---------- */
const OFF_MIN=60,OFF_CAP=3600;
const offlineRate=()=>(0.1+0.4*st.hire*(1+0.15*st.hup))*8*mult();
function checkOffline(){
  if(title)return;
  const now=Date.now(),t0=Number(st.ts);st.ts=now;
  if(!isFinite(t0)||t0<=0||st.earned<30||offline)return;
  const sec=(now-t0)/1000;if(sec<OFF_MIN)return;
  const amt=Math.min(offlineRate()*Math.min(sec,OFF_CAP),st.earned*0.5);
  if(amt<1)return;
  st.money+=amt;offline={amt,sec};menu=null;hold.on=false;save();
}
const fmtDur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>=24?'más de un día':h?h+' h '+m+' min':m+' min';};
const pauseBtn=()=>({x:VW-16-22-52,y:16+22,r:22});
function openMenu(){
  if(spec.open||offline||menu||title)return;
  menu='main';hold.on=false;hold.t=0;joy.on=false;joy.x=joy.y=0;for(const k in keys)keys[k]=false;save();
}
function closeMenu(){menu=null;hold.on=false;hold.t=0;}
function menuGeom(){const w=Math.min(300,VW-32),h=290,x=VW/2-w/2,y=Math.max(8,VH*0.5-h/2),bx=x+12,bw=w-24;
  return{x,y,w,h,resume:{x:bx,y:y+62,w:bw,h:56},sound:{x:bx,y:y+126,w:bw,h:48},home:{x:bx,y:y+182,w:bw,h:44},reset:{x:bx,y:y+240,w:bw,h:36},
    hold:{x:bx,y:y+104,w:bw,h:44},back:{x:bx,y:y+206,w:bw,h:56}};}
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function menuTap(p,e){
  const g2=menuGeom();
  if(menu==='main'){
    if(inRect(p,g2.resume))closeMenu();
    else if(inRect(p,g2.sound)){st.mute=st.mute?0:1;musicSync();save();}
    else if(inRect(p,g2.home)){save();closeMenu();title=true;}
    else if(inRect(p,g2.reset)){menu='confirm';hold.on=false;hold.t=0;}
  }else if(menu==='confirm'){
    if(inRect(p,g2.back)){menu='main';hold.on=false;hold.t=0;}
    else if(inRect(p,g2.hold)){hold.on=true;hold.id=e.pointerId;hold.t=0;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  }
}
/* full restart from zero; only the sound preference survives. The old save is kept under a -prev key. */
function resetGame(){
  try{localStorage.setItem(SAVE+'-prev',localStorage.getItem(SAVE)||'');}catch(e){}
  st=Object.assign(fresh(),{mute:st.mute});
  cash.pile=0;counter.stock=[0,0,0];player.carry.length=0;
  Object.assign(player,{x:300,y:600,vx:0,vy:0,padT:0,takeT:0,dropT:0,cashT:0,lean:0,moving:false,padLock:false});
  machines.forEach((m,i)=>{m.timer=0;m.stock=i===0?2:0;});
  helpers.length=0;syncHelpers();
  customers=[];for(const s2 of SLOTS)s2.c=null;spawnT=0.5;resetBar();
  fly=[];floats=[];confetti=[];
  rush.left=0;rush.next=rand(70,100);
  offline=null;spec.open=false;menu=null;hold.on=false;hold.t=0;
  joy.on=false;joy.x=joy.y=0;for(const k in keys)keys[k]=false;
  shownMoney=0;saveT=0;camReady=false;
  banner={txt:'¡Empezamos de cero!',sub:'Buena suerte, chef',t:0};
  save();
}
function startGame(){
  if(!title)return;
  title=false;joy.on=false;joy.x=joy.y=0;for(const k in keys)keys[k]=false;
  initAudio();
  if(st.prestige>0&&!st.spec)spec.open=true;
  checkOffline();save();
}
function chooseSpec(id){
  if(!SPECS.some(x=>x.id===id))return;
  st.spec=id;spec.open=false;
  if(id==='bak')st.dm=Math.max(st.dm,1);
  if(id==='caf')st.coffee=Math.max(st.coffee,1);
  if(id==='piz'){st.coffee=Math.max(st.coffee,1);st.pizza=Math.max(st.pizza,1);}
  const sp=specOf();banner={txt:sp.name,sub:sp.desc,t:0};
  syncHelpers();sfx.unlock();save();
}
function specGeom(){const w=Math.min(300,VW-32),h=250,x=VW/2-w/2,y=Math.max(8,VH*0.5-h/2);
  return{x,y,w,h,btn:i=>({x:x+12,y:y+58+i*64,w:w-24,h:56})};}
function offGeom(){const w=Math.min(300,VW-32),h=196,x=VW/2-w/2,y=VH*0.42-h/2;return{x,y,w,h};}
const offBtn=()=>{const c=offGeom();return{x:VW/2-90,y:c.y+c.h-58,w:180,h:44};};

/* ---------- audio ---------- */
let ac=null;
function initAudio(){if(ac){if((ac.state==='suspended'||ac.state==='interrupted')&&!document.hidden)ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  loadMusic();}
/* background music: fetched next to the page, decoded once and looped by Web Audio (no gap between loops) */
let mGain=null,mSrc=null,mLoading=false,mTries=0;
const MUSIC_VOL=0.32;
function loadMusic(){
  if(mLoading||!ac)return;mLoading=true;
  try{if(!mGain){mGain=ac.createGain();mGain.gain.value=st.mute?0:MUSIC_VOL;mGain.connect(ac.destination);}}catch(e){mLoading=false;return;}
  fetch('music.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
   .then(b=>new Promise((ok,no)=>ac.decodeAudioData(b,ok,no)))
   .then(buf=>{mSrc=ac.createBufferSource();mSrc.buffer=buf;mSrc.loop=true;mSrc.connect(mGain);mSrc.start();})
   .catch(()=>{mLoading=false;if(++mTries<4)setTimeout(loadMusic,4000);});
}
function musicSync(){if(mGain&&ac)mGain.gain.setTargetAtTime(st.mute?0:MUSIC_VOL,ac.currentTime,0.08);}
function beep(f,d=0.08,type='sine',v=0.07,slide=0,delay=0){
  if(st.mute||!ac)return;
  try{const t0=ac.currentTime+delay,o=ac.createOscillator(),ga=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+d);
    ga.gain.setValueAtTime(v,t0);ga.gain.exponentialRampToValueAtTime(0.0008,t0+d);
    o.connect(ga);ga.connect(ac.destination);o.start(t0);o.stop(t0+d+0.02);}catch(e){}
}
const sfx={
  take:n=>beep(380+n*32,0.06,'square',0.04),
  drop:n=>beep(520+n*18,0.05,'square',0.035,0.7),
  cash:()=>beep(1250+rand(0,350),0.04,'square',0.02),
  sell:()=>{beep(880,0.07,'square',0.035);beep(1320,0.1,'square',0.035,0,0.06);},
  pay:()=>beep(300+rand(0,60),0.04,'square',0.02),
  unlock:()=>[523,659,784,1047].forEach((f,i)=>beep(f,0.14,'square',0.05,0,i*0.08)),
};
function buzz(ms){try{if(!st.mute&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ---------- screen & input ---------- */
let VW=1,VH=1,DPR=1,S=1,K=3,LW=1,LH=1,U=1,offx=0,offy=0,sizedOnce=false,camReady=false;
const cam={x:360,y:460};
const joy={on:false,id:null,ox:0,oy:0,x:0,y:0};
const keys={};
const muteBtn=()=>({x:VW-16-22,y:16+22,r:22});
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=Math.max(1,cv.clientWidth);VH=Math.max(1,cv.clientHeight);
  const cw=Math.round(VW*DPR),ch=Math.round(VH*DPR);if(sizedOnce&&cw===cv.width&&ch===cv.height)return;
  sizedOnce=true;camReady=false;cv.width=cw;cv.height=ch;
  const s0=Math.max(Math.min(VW/(W+20),VH/1000),0.45);
  K=Math.max(2,Math.round(s0*P*DPR)); // device pixels per art pixel (integer = crisp pixels)
  S=K/(DPR*P);U=DPR/K;
  LW=Math.ceil(cv.width/K)+1;LH=Math.ceil(cv.height/K)+1;lo.width=LW;lo.height=LH;
}
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
resize();
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  const p=pt(e),m=muteBtn();
  if(title){const tg=titleGeom();
    if(Math.hypot(p.x-m.x,p.y-m.y)<m.r+3){st.mute=st.mute?0:1;musicSync();save();}
    else if(inRect(p,tg.play))startGame();
    e.preventDefault();return;}
  if(menu){menuTap(p,e);e.preventDefault();return;}
  if(spec.open){const g2=specGeom();for(let i=0;i<SPECS.length;i++){const b2=g2.btn(i);if(p.x>=b2.x&&p.x<=b2.x+b2.w&&p.y>=b2.y&&p.y<=b2.y+b2.h){chooseSpec(SPECS[i].id);break;}}e.preventDefault();return;}
  {const ob=offline&&offBtn();if(ob&&p.x>=ob.x&&p.x<=ob.x+ob.w&&p.y>=ob.y&&p.y<=ob.y+ob.h){offline=null;sfx.unlock();e.preventDefault();return;}}
  if(offline){e.preventDefault();return;}
  {const pb=pauseBtn();if(!offline&&Math.hypot(p.x-pb.x,p.y-pb.y)<m.r+3){openMenu();e.preventDefault();return;}}
  if(Math.hypot(p.x-m.x,p.y-m.y)<m.r+3){st.mute=st.mute?0:1;musicSync();save();e.preventDefault();return;}
  if(joy.on||e.button>0)return;
  joy.on=true;joy.id=e.pointerId;joy.ox=p.x;joy.oy=p.y;joy.x=joy.y=0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(hold.on&&e.pointerId===hold.id){if(!inRect(pt(e),menuGeom().hold)){hold.on=false;hold.t=0;}}
  if(!joy.on||e.pointerId!==joy.id)return;
  const p=pt(e);let dx=p.x-joy.ox,dy=p.y-joy.oy;const d=Math.hypot(dx,dy),R=48;
  if(d>R){joy.ox+=dx*(1-R/d);joy.oy+=dy*(1-R/d);dx=p.x-joy.ox;dy=p.y-joy.oy;}
  joy.x=dx/R;joy.y=dy/R;
});
const endJoy=e=>{initAudio();if(e.pointerId===hold.id){hold.on=false;hold.t=0;}if(e.pointerId===joy.id){joy.on=false;joy.x=joy.y=0;}};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const kk=e.key.toLowerCase();
  if(title){if((kk==='enter'||kk===' ')&&!e.repeat){initAudio();startGame();}if(kk==='enter'||kk===' ')e.preventDefault();return;}
  if((kk==='escape'||kk==='p')&&!e.repeat){if(menu==='confirm'){menu='main';hold.on=false;hold.t=0;}else if(menu)closeMenu();else openMenu();e.preventDefault();return;}
  if(menu)return;
  keys[e.key.toLowerCase()]=true;initAudio();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.on=false;joy.x=joy.y=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();try{ac&&ac.suspend();}catch(e){}}else{try{ac&&ac.resume();}catch(e){}checkOffline();}});
addEventListener('pagehide',save);

/* ---------- effects ---------- */
function flyItem(kind,x0,y0,to,oy,dur=0.28){fly.push({kind,x0,y0,to,oy,t:0,dur});}
function floatTxt(x,y,txt,col='#fff'){floats.push({x,y,txt,col,t:0});}
function burst(x,y,n=36){
  if(REDUCED)return;
  const cols=['#ff4f8f','#ffc83d','#2fbf8f','#4f9dff','#fff6e6'];

}
function fmt(n){n=Math.floor(n);
  if(n<10000)return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const u=['K','M','B','T'];let i=-1;while(n>=999.5&&i<u.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0))+u[i];}

function moveToward(o,tx,ty,spd,dt){
  const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<3){o.moving=false;return true;}
  const s=Math.min(d,spd*dt);o.x+=dx/d*s;o.y+=dy/d*s;
  o.moving=true;o.walk+=dt*12;if(Math.abs(dx)>2)o.face=dx>0?1:-1;
  return false;
}
function buy(p){
  st.paid[p.id]=0;
  if(p.id==='branch'){
    const pr=st.prestige+1,mute=st.mute;
    st=Object.assign(fresh(),{prestige:pr,mute,tut:1,first:1,earned:st.earned});spec.open=true;
    player.carry.length=0;counter.stock=[0,0,0];for(const m of machines)m.stock=m.on()?Math.min(m.stock,8):0;rush.left=0;
    customers=[];for(const s of SLOTS)s.c=null;spawnT=0.4;resetBar();
    banner={txt:'¡Sucursal nº '+(pr+1)+'!',sub:'Todo se vende a +'+pr*100+'%',t:0};
    burst(player.x,player.y,90);
  }else{
    st[p.id]++;st.tut=Math.max(st.tut,1);if(p.id==='wash')plates.clean+=2;
    floatTxt(p.x,p.y-40,p.id==='hire'?'¡Nuevo empleado!':'¡'+p.name+' mejorado!','#fff6e6');
    burst(p.x,p.y,40);
  }
  player.padLock=true;syncHelpers();sfx.unlock();buzz(40);save();
}
function pickJob(h){
  // send the helper to the product running lowest on the counter, spreading helpers out
  const busy=[0,0,0];for(const o of helpers)if(o!==h&&o.m)busy[o.t]++;
  let best=DONUT,bs=1e9;
  for(const t of products()){const sc=counter.stock[t]+7*busy[t]-0.3*machines.reduce((a,m)=>a+(m.t===t&&m.on()?m.stock:0),0);
    if(sc<bs){bs=sc;best=t;}}
  h.t=best;h.m=machines.filter(m=>m.t===best&&m.on()).sort((a,b)=>b.stock-a.stock)[0]||null;
}
function spawnDiner(){
  if(!st.bar||plates.clean<1||Math.random()>=0.3)return false;
  const seat=SEATS.find(x=>!x.c&&!x.dirty);if(!seat)return false;

function dinerLeave(c,dirty){

function dinerDone(c){

  pay*=DINER_MUL*(rush.left>0?1.5:1);cash.pile+=pay;st.earned+=pay;

function update(dt){
  time+=dt;
  if(menu==='confirm'&&hold.on){hold.t+=dt;if(hold.t>=HOLD_T){resetGame();return;}}
  if(spec.open||menu||offline||title)return;
  /* player movement */
  let ix=joy.x,iy=joy.y;
  if(keys['arrowleft']||keys['a'])ix-=1;if(keys['arrowright']||keys['d'])ix+=1;
  if(keys['arrowup']||keys['w'])iy-=1;if(keys['arrowdown']||keys['s'])iy+=1;
  let il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;il=1;}
  if(il<0.12){ix=iy=0;il=0;}
  const sp=speed();
  player.vx+=(ix*sp-player.vx)*Math.min(1,dt*14);
  player.vy+=(iy*sp-player.vy)*Math.min(1,dt*14);
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.moving=il>0;
  if(player.moving){player.walk+=dt*13*Math.max(0.5,il);if(Math.abs(ix)>0.15)player.face=ix>0?1:-1;}
  player.lean+=((-player.vx*0.011)-player.lean)*Math.min(1,dt*7);
  for(const m of machines){if(!m.on())continue;
    const dx=player.x-m.x,dy=player.y-(m.y+6),d=Math.hypot(dx,dy),R=58;
    if(d<R&&d>0.01){player.x=m.x+dx/d*R;player.y=m.y+6+dy/d*R;}}
  {const dx=player.x-cash.x,dy=player.y-cash.y,d=Math.hypot(dx,dy),R=34;
    if(d<R&&d>0.01){player.x=cash.x+dx/d*R;player.y=cash.y+dy/d*R;}}
  player.x=clamp(player.x,34,W-34);player.y=clamp(player.y,72,790);

  /* machines */
  for(const m of machines){if(!m.on())continue;
    if(m.stock<trayMax()){m.timer+=dt;const iv=ovenInterval()*MAKE_T[m.t];
      if(m.timer>=iv){m.timer=0;m.stock++;}}
    const z=pickupOf(m);
    if(Math.hypot(player.x-z.x,player.y-z.y)<64&&m.stock>0&&player.carry.length<capacity()){
      player.takeT-=dt;
      if(player.takeT<=0){player.takeT=0.075;m.stock--;player.carry.push(m.t);const tr=trayOf(m);
        flyItem(m.t,tr.x,tr.y,player,-30-player.carry.length*6,0.16);sfx.take(player.carry.length);buzz(8);}
    }
  }
  /* drop at counter */
  if(player.y>718&&player.x>120&&player.x<600&&player.carry.length){
    player.dropT-=dt;
    if(player.dropT<=0){
      let idx=-1;for(let i=player.carry.length-1;i>=0;i--){if(counter.stock[player.carry[i]]<COUNTER_MAX){idx=i;break;}}
      if(idx>=0){const t=player.carry.splice(idx,1)[0];player.dropT=0.06;
        flyItem(t,player.x,player.y-40,{x:counter.x[t],y:counter.y},-counter.stock[t]*4,0.2);
        counter.stock[t]++;sfx.drop(player.carry.length);buzz(6);}
    }
  }
  /* collect cash */
  if(cash.pile>0.01&&Math.hypot(player.x-cash.x,player.y-cash.y)<78){
    const amt=Math.min(cash.pile,Math.max(cash.pile*5,90)*dt);
    cash.pile-=amt;st.money+=amt;if(cash.pile<0.01){cash.pile=0;}
    player.cashT-=dt;if(player.cashT<=0){player.cashT=0.05;flyItem('bill',cash.x+rand(-10,10),cash.y-10,player,-34,0.22);sfx.cash();}
  }
  /* bar: pick up dirty plates, load the dishwasher, wash in batches */
  if(st.bar){
    for(const sd of SEATS){if(sd.dirty&&player.plates<4&&Math.hypot(player.x-684,player.y-(sd.y+4))<58){sd.dirty=false;player.plates++;sfx.take(player.plates);buzz(8);}}
    if(player.plates>0&&Math.hypot(player.x-WASHER.x,player.y-WASHER.y)<70){
      washer.queue+=player.plates;flyItem('dplate',player.x,player.y-30,{x:WASHER.x,y:WASHER.y-26},0,0.2);player.plates=0;sfx.drop(3);barHintDone=true;}
    if(washer.cur===0&&washer.queue>0){washer.cur=Math.min(washer.queue,4+2*st.wash);washer.queue-=washer.cur;washer.t=0;}
    if(washer.cur>0){washer.t+=dt;if(washer.t>=washTime()){plates.clean+=washer.cur;washer.cur=0;floatTxt(WASHER.x,WASHER.y-60,'¡Platos limpios!','#bfe6ff');sfx.sell();}}
  }
  /* pads */
  let onPad=null;
  for(const p of PADS){if(padOn(p)&&Math.abs(player.x-p.x)<48&&Math.abs(player.y-p.y)<48){onPad=p;break;}}
  if(!onPad)player.padLock=false;
  if(onPad&&st.money>=1&&!player.padLock){
    player.padT+=dt;
    if(player.padT>0.8){
      const cost=costOf(onPad),paid=st.paid[onPad.id]||0;
      const amt=Math.min(st.money,cost-paid,Math.max(cost/0.9,60)*dt);
      st.money-=amt;st.paid[onPad.id]=paid+amt;
      player.cashT-=dt;if(player.cashT<=0){player.cashT=0.06;flyItem('bill',player.x,player.y-34,onPad,0,0.2);sfx.pay();}
      if(st.paid[onPad.id]>=cost-0.001){player.padT=-0.5;buy(onPad);}
    }
  }else if(!onPad)player.padT=0;

  /* helpers */
  const hc=4+st.prestige+2*st.hup,hs=165+22*st.hup;
  for(const h of helpers){
    if(h.state==='toMachine'&&(!h.m||!h.m.on()))pickJob(h);
    const m=h.m;if(!m){h.moving=false;continue;}
    const z=pickupOf(m),ox=(h.i%2?22:-22),oy=(h.i>1?14:0);
    if(h.state==='toMachine'){
      if(moveToward(h,z.x+ox,z.y+oy,hs,dt)){h.state='load';h.wait=0;}
    }else if(h.state==='load'){
      h.actT-=dt;h.wait+=dt;
      if(m.stock>0&&h.carry.length<hc&&h.actT<=0){m.stock--;h.carry.push(h.t);h.actT=0.14;h.wait=0;
        const tr=trayOf(m);flyItem(h.t,tr.x,tr.y,h,-30,0.16);}
      if(h.carry.length>=hc||(h.carry.length>0&&h.wait>1.6))h.state='toCounter';
      else if(!h.carry.length&&h.wait>2.5){h.m=null;h.state='toMachine';}
    }else if(h.state==='toCounter'){
      if(moveToward(h,counter.x[h.t]+ox*1.6,772-oy*0.5,hs,dt))h.state='unload';
    }else{
      h.actT-=dt;
      if(h.carry.length&&counter.stock[h.t]<COUNTER_MAX&&h.actT<=0){h.carry.pop();h.actT=0.11;
        flyItem(h.t,h.x,h.y-40,{x:counter.x[h.t],y:counter.y},-counter.stock[h.t]*4,0.2);counter.stock[h.t]++;}
      if(!h.carry.length){h.state='toMachine';h.m=null;}
    }
  }

  /* customers */
  spawnT-=dt;
  if(spawnT<=0){
    const free=SLOTS.filter(s=>!s.c);
    if(spawnDiner()){spawnT=rand(0.7,1.6)/(1+0.1*st.price)/(rush.left>0?2:1);}
    else if(free.length){
      const s=free[Math.floor(Math.random()*free.length)];
      const opts=[[DONUT,1]];if(st.coffee)opts.push([COFFEE,.8]);if(st.pizza)opts.push([PIZZA,.7]);
      const sp=specOf();if(sp)for(const o of opts)if(o[0]===sp.t)o[1]*=2;
      const pick=()=>{let r=Math.random()*opts.reduce((a,o)=>a+o[1],0);for(const [tt,w] of opts){if((r-=w)<=0)return tt;}return DONUT;};
      const qty=t=>{let m=Math.min(7,3+Math.floor((st.cap+st.oven)/3));if(t===PIZZA)m=Math.min(m,4);return 1+Math.floor(Math.random()*m);};
      const r0=Math.random();
      const kind=(opts.length>=2&&st.earned>400&&r0<0.12)?'vip':(st.earned>800&&r0<0.30)?'imp':'normal';
      const need=[0,0,0],t=pick();need[t]=qty(t);
      if(kind==='vip'){let t2=pick();for(let k=0;k<8&&t2===t;k++)t2=pick();if(t2===t)need[t]+=2;else need[t2]=Math.ceil(qty(t2)/2);}
      const c={x:s.x+rand(-70,70),y:WORLD_BOT+70,slot:s,state:'in',t,need,got:[0,0,0],kind,pat:kind==='imp'?14:kind==='vip'?28:45,
        serveT:0.2,walk:0,face:1,moving:true,waitT:0,
        body:kind==='vip'?'#ffc83d':kind==='imp'?'#e2483d':['#4f9dff','#ff8a5c','#a86ff2','#2fbf8f','#f4c542','#ff6f91'][Math.floor(rand(0,6))],
        hair:kind==='vip'?'#fff6e6':['#5b3a29','#2b2b36','#e2b04a','#c0503f','#f08ab8'][Math.floor(rand(0,5))],
        skin:['#f6c9a0','#d99e73','#a8704a','#ffdcbc'][Math.floor(rand(0,4))]};
      s.c=c;customers.push(c);
      spawnT=rand(0.7,1.6)/(1+0.1*st.price)/(rush.left>0?2:1);
    }else spawnT=0.3;
  }
  for(const c of customers){
    if(c.state==='in'){if(moveToward(c,c.slot.x,c.slot.y,150,dt)){c.state='wait';c.face=1;c.waitT=0;}}
    else if(c.state==='wait'){
      c.serveT-=dt;c.waitT+=dt;
      let t=-1;for(let k=0;k<3;k++)if(c.need[k]>c.got[k]&&counter.stock[k]>0){t=k;break;}
      if(c.serveT<=0&&t>=0){
        counter.stock[t]--;c.got[t]++;c.serveT=0.13;
        flyItem(t,counter.x[t],counter.y-counter.stock[t]*4,c,-30,0.2);
      }
      const done=c.need.every((n,k)=>c.got[k]>=n);
      if(c.kind==='diner'){if(done){c.state='eat';c.eatT=0;}else if(c.waitT>=c.pat)dinerLeave(c,false);}
      else if(done||c.waitT>=c.pat){
        const served=c.got[0]+c.got[1]+c.got[2];
        if(served>0){
          if(!st.first&&done){st.first=1;banner={txt:'¡Primera venta!',sub:'Recoge el dinero de la mesa',t:0};burst(c.x,c.y,50);sfx.unlock();}
          const tip=done&&c.waitT<=TIP_T;let pay=0;for(let k=0;k<3;k++)pay+=c.got[k]*priceOf(k);
          pay*=(tip?1.3:1)*(rush.left>0?1.5:1)*(c.kind==='vip'&&done?3:1);
          if(tip)floatTxt(c.x,c.y-104,'¡Propina!','#7dffb0');
          if(c.kind==='vip'&&done)floatTxt(c.x,c.y-122,'¡VIP x3!','#ffd34d');
          cash.pile+=pay;st.earned+=pay;
          for(let i=0;i<Math.min(6,served+1);i++)fly.push({kind:'bill',x0:c.x,y0:c.y-40,to:cash,oy:-12,t:-i*0.05,dur:0.4});
          floatTxt(c.x,c.y-80,'+$'+fmt(pay),'#ffe27a');sfx.sell();
        }
        if(!done)floatTxt(c.x,c.y-96,c.kind==='imp'?'¡Uf!':'...','#ff8a8a');
        c.state='out';c.slot.c=null;const hw=LW*P/2+90;c.tx=c.x<W/2?W/2-hw:W/2+hw;c.ty=rand(1010,1120);
      }
    }else if(c.state==='eat'){c.eatT+=dt;if(c.eatT>=EAT_T)dinerDone(c);}
    else{moveToward(c,c.tx,c.ty,150,dt);if(Math.abs(c.x-c.tx)<6)c.dead=true;}
  }
  customers=customers.filter(c=>!c.dead);

  /* effects */
  for(const f of fly)f.t+=dt;
  fly=fly.filter(f=>f.t<f.dur);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.1);
  for(const p of confetti){p.t+=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  confetti=confetti.filter(p=>p.t<1.4);
  if(rush.left>0){rush.left-=dt;if(rush.left<=0)rush.next=rand(70,100);}
  else if(st.earned>150){rush.next-=dt;if(rush.next<=0){rush.left=15;spawnT=0;
    banner={txt:'¡HORA PICO!',sub:'Más clientes y pagan +50%',t:0};[784,988,1175].forEach((f,i)=>beep(f,0.14,'square',0.04,0,i*0.09));buzz(60);}}
  if(banner){banner.t+=dt;if(banner.t>3.2)banner=null;}
  if(mSrc&&ac)mSrc.playbackRate.setTargetAtTime(rush.left>0?1.07:1,ac.currentTime,0.4);
  shownMoney+=(st.money-shownMoney)*Math.min(1,dt*12);
  if(Math.abs(st.money-shownMoney)<0.5)shownMoney=st.money;
  saveT+=dt;if(saveT>3){saveT=0;save();}

  /* camera */
  const vw=LW*P,vh=VH/S,hu=HUD_TOP/S,wh=WORLD_BOT-WORLD_TOP;
  const tx=vw>=W?W/2:clamp(player.x,vw/2,W-vw/2);
  const ty=(wh+hu<=vh)?WORLD_TOP+vh/2-(hu+(vh-hu-wh)/2):clamp(player.y-80,WORLD_TOP+vh/2-hu,WORLD_BOT-vh/2);
  if(!camReady){cam.x=tx;cam.y=ty;camReady=true;}
  cam.x+=(tx-cam.x)*Math.min(1,dt*8);cam.y+=(ty-cam.y)*Math.min(1,dt*8);
}

function draw(){

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.25)dt=0.25;
  try{const steps=Math.max(1,Math.ceil(dt/0.034));
    for(let i=0;i<steps;i++)update(dt/steps);
    draw();}catch(e){if(!frame.err){frame.err=1;console.error(e);}}
  requestAnimationFrame(frame);
}
